server:
  port: 8080

spring:
  application:
    name: smart-door-backend

datasource:
  url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smart_door}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
  username: ${DB_USERNAME:root}
  password: ${DB_PASSWORD:}
  driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate     # Flyway owns schema, JPA only validates against it
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-expiration-ms: 86400000        # 24 hours
    refresh-token-expiration-ms: 604800000    # 7 days
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200,https://smart-door-frontend-cyan.vercel.app,https://smart-door-frontend-j7cg0gb3i-rajasekaran.vercel.app}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

logging:
  level:
    com.smartdoor.security: INFO
    org.springframework.security: WARN
