version: "3.8"
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: smart_door_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: .
    depends_on:
      - mysql
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: smart_door_db
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: change-this-to-a-long-random-secret-key-in-production-min-256-bits
      CORS_ORIGINS: http://localhost:4200
    ports:
      - "8080:8080"

volumes:
  mysql_data:
